<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="Buy QaaF Premium Tea Powder — Available on Amazon and Flipkart.">
  <meta name="theme-color" content="#ffffff">
  <title>Buy QaaF Premium</title>

  <!-- Fonts -->
  <style>
    @font-face {
      font-family: 'Bask';
      src: url('assets/Baskerville.ttf') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Gian';
      src: url('assets/Gianiteh.otf') format('opentype');
      font-display: block;
    }
  </style>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="/favicon.png?v=3">
  <link rel="shortcut icon" href="/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/favicon.png?v=3">
</head>
<body>

  <!-- Cursor -->
  <div id="cDot"></div>
  <div id="cRing"></div>

  <!-- ══ BUY PAGE ══ -->
  <div class="buy-page">

    <!-- NAV -->
    <div class="bnav">
      <a class="bback" href="index.html" aria-label="Back to home">&#8592;</a>
      <div class="nbrand">
        <span class="nb-q">QaaF</span>
        <span class="nb-p">Premium</span>
      </div>
      <div class="bnav-actions" style="margin-left: auto; display: flex; align-items: center; gap: 16px;">
        <a class="f-ig" href="https://www.instagram.com/qaaf__premium?igsh=MTk1b2llcnppeDg1dQ==" target="_blank" rel="noopener noreferrer" aria-label="Visit our Instagram" style="color: var(--g); opacity: 0.6;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
        <button class="hm-btn" id="hmBtn" aria-label="Settings Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- BODY -->
    <div class="bbody">

      <!-- 1. Product image -->
      <div class="bpwrap">
        <div class="bglow"></div>
        <img
          class="bpimg"
          src="assets/product.jpg"
          alt="QaaF Premium Tea Powder"
        >
      </div>

      <!-- 2 + 3. Info, size, buttons -->
      <div class="binfo">

        <div class="b-eye">Select &amp; Order</div>
        <div class="b-ttl">QaaF</div>
        <div class="b-sub">Premium Tea Powder</div>
        <div class="b-rule"></div>



        <!-- Store buttons -->
        <div class="sbtns">
          <a
            class="sbtn amz"
            href="https://www.amazon.in"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="bico">&#128722;</span>Buy on Amazon
          </a>
          <a
            class="sbtn fkrt"
            href="https://www.flipkart.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="bico">&#128717;</span>Buy on Flipkart
          </a>
        </div>

        <div class="social-proof">People are showing interest</div>

        <div class="bnote">
          &#10022; Genuine product guaranteed<br>
          Free delivery &middot; Easy returns
        </div>

      </div><!-- /binfo -->

    </div><!-- /bbody -->

  </div><!-- /buy-page -->

  <!-- ══ SIDE PANEL ══ -->
  <div class="side-panel-overlay" id="spOverlay"></div>
  <aside class="side-panel" id="sidePanel">
    <div class="sp-head">
      <span class="sp-title">Settings</span>
      <button class="sp-close" id="spClose" aria-label="Close Settings">&times;</button>
    </div>
    <div class="sp-body">
      <div class="sp-setting">
        <span>Day / Night Mode</span>
        <label class="theme-switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
